[Display]
; Fullscreen=0 -> windowed (recommended for two-instance co-op testing)
; Fullscreen=1 -> leave the game in its normal fullscreen mode
Fullscreen=0
; Borderless applies only when windowed. 0 = bordered window, 1 = borderless (WS_POPUP)
Borderless=0
; How long (ms) to keep re-asserting windowed after attach, to beat the engine's command-line
; parse/display init. Increase if the game boots slowly and still starts fullscreen.
ForceWindowedMs=5000

[Coop]
; Entity relevance (Phase 1): replicate an NPC if it is within 80 m of YOUR player, or within
; RelevanceRadiusM metres of the PEER. Ships use their own (wider) radius. 0 = no filter.
RelevanceRadiusM=250
ShipRelevanceRadiusM=1000
; Phase 1 puppet spawn (press F6 in-game). 0 = build entity only + log (safe verification).
; 1 = also add to world, position at player+2m, and RegisterPlayer(pad=1).
IntegratePuppet=1
; Additionally bind the puppet to pad 1 (RegisterPlayer). Test visibility first (0), then try 1.
RegisterPad1=1
; The player's EntityBuilder is released after spawn; reload it by ID before building. 1 = on.
ReloadBuilder=0
; Replicate the player's locomotion state (speed/heading) onto the puppet so it walks/runs in sync.
DriveLocomotion=1
; Replicate the active Human CONTEXT (parkour/climb/wall-run/jump/swim), not just ground locomotion.
; Makes the puppet enter the peer's current context so its animation statechart plays the right move
; while the transform is synced. 1 = on, 0 = ground only. Experimental - A/B this if a move looks wrong.
; NOTE: for the braindead T-Pose baseline (DriveActions=0) keep this 0.
DriveContext=0
; Which contexts the puppet is ALLOWED to enter (bitmask, bit N = context id N; hex or decimal).
; The target-needing parkour contexts (Ladder=5, Ledge=7, Walling=8, NarrowObject=9, Climbing=30,
; Hanging=31, Boat=11) CRASH the engine's later update on a teleported puppet, so they are OFF by
; default. Only InAir=6 and Swim=10 are self-contained and safe: default 0x440 = (1<<6)|(1<<10).
; Ground=2 is always allowed. A disallowed context just keeps the puppet on the ground (no crash).
; Set 0xFFFFFFFF to allow everything (WILL crash on wall/ledge parkour - for testing the real fix only).
DriveContextMask=0x440
; Replicate the peer's current ACTION (animation clip) directly onto the puppet via SetTargetAction, so
; it animates like the peer regardless of context (universal anim sync). 1 = on, 0 = off. Read at startup.
; With DriveActions=0 AND DisablePuppetAI=1 the puppet is fully braindead: ActionComponent disabled ->
; T-Pose, position/orientation synced only (baseline, confirmed). DriveActions=1 = action replication
; (play the peer's real action clips) — the working mode. Keep DriveContext=0 in this mode.
DriveActions=1
; Disable the puppet's own behavior component so its statechart stops issuing its own actions/physics that
; fight our sync (was causing jitter + crashes). Makes the puppet a pure playback dummy. 1 = on (recommended
; with DriveActions), 0 = leave the puppet's AI running.
; NOTE: overridden per-context when HybridLoco=1 (see below).
DisablePuppetAI=1
; HybridLoco: per-context action ownership (fixes locomotion gait without the concurrent-action crash).
; The crash happens when the game and we play an action at the same time from different threads, so we keep
; EXACTLY ONE action-writer at all times:
;   - GROUND context: the puppet's OWN FSM owns actions (behavior ENABLED, we only feed HumanGroundData,
;     we never SetTargetAction) -> real walk/jog/run gait, like the early MVP.
;   - every OTHER context (jump/climb/swim/combat): WE own actions (behavior DISABLED + action replication).
; Behavior is toggled at the boundary with a short cooldown so the two owners never overlap in one frame.
; 1 = hybrid (recommended). 0 = old global-flag behavior (DisablePuppetAI/DriveActions above) for A/B.
HybridLoco=1
; SeekOnSwitch: when the puppet switches action, seek the new clip to the peer's playback phase instead of
; starting at frame 0. 1 = on. Set 0 to A/B if transitions look snappy (the seek may also advance the blend).
SeekOnSwitch=1
; MinBlendInMs: when the peer switched action with NO blend (e.g. a transition clip handing off to its target),
; the puppet blends this long instead of hard-cutting, to hide network timing. 0 = copy the cut exactly.
MinBlendInMs=100
; Suppress ALL ambient entity spawning (pedestrians, guards, other NPCs, ships) so both clients show
; the same empty world - un-synced ambient entities are seeded independently per client. Hooks the
; universal SpawningRequest::Spawn to decline every spawn (plus a crowd-source hook). Existing entities
; clear out as they leave. 1 = no ambient spawns, 0 = normal. Read once at startup.
DisableSpawns=1

; Null/stale target guards (DerefGuard). Both default 1 and are independent:
;   GuardNullTarget=1 GuardStaleTarget=0  -> exactly the previous build's behaviour (A/B baseline)
;   GuardNullTarget=0 GuardStaleTarget=1  -> stale-target guard alone
; GuardNullTarget: the six per-site null guards on [node+0x114] / [node+0x118] (sub_679750 / sub_681980).
; GuardStaleTarget: validates the object loaded at 0x006795FD -- non-null, plausible pointer, and a
; vtable inside .rdata -- before the engine's unchecked virtual call (the 0x0073448F / EDX=0xFFFFFFFF
; crash). A rejected pointer takes the engine's own "no target" path at 0x00679611.
GuardNullTarget=1
GuardStaleTarget=1

; TransformProbe (default 0 = OFF): READ-ONLY diagnostic, changes no behaviour and nothing on the wire.
; Every 30 frames it appends, to phase1_log_<pid>.txt, the four documented transform sources for the
; local player and the puppet (if one exists):
;   wire  = Entity+0x10 m_GlobalMatrix (what the snapshot sends today, suspected stale)
;   cc1A0 = CharacterController+0x1A0      cc1C0 = CharacterController+0x1C0
;   node  = [[CharacterController+0x510]+0x00..0x3F]  (the composed node matrix)
; plus a `valid` line saying which pointers were actually readable. One run with this on decides which
; source is live (Entity+0x40 has no per-frame writer; 4.83 m peak peer-position error observed).
; It only reads memory; it never writes engine memory, calls a setter, or allocates.
TransformProbe=0

; IdentityBand (default 0 = OFF): READ-ONLY diagnostic for the two-machine weekend run. Once per
; second it appends, to the phase1 log, the local player's own entity plus the 32 nearest entities
; within 30 m (nearest first):
;   [IB] f=<frame> n=<count>
;   [IB]   1 ent=0x.. h=0x.. reg=.. id=0x....  band=portable|minted|null d=<metres>
; `band` is minted for ids >= 0xF0000000 (local mint counter, NOT wire-portable), portable for
; ids < 0xF0000000 (nonzero), null for 0 / 0xFFFFFFFF. The distance is what lets a human pair the
; same NPC across the two logs positionally.
; Works with EntitySync=0: it is not gated on the entity lane or on EntityHost.
; It only reads memory and calls the read-only id thunk (arg_4=0 gates minting); it never writes
; engine memory, allocates, or changes behaviour.
IdentityBand=0

[Net]
; Peer-to-peer co-op link. Enabled=1 on BOTH machines. Set PeerIP to the OTHER machine's IP.
; When enabled, the puppet auto-spawns to represent the peer (no F6 needed) and mirrors them.
; Same-PC two-instance test: keep PeerIP=127.0.0.1 and the two different ports below (auto port-swap).
; Two separate PCs: set PeerIP to the other PC, and set PeerPort=47801 (same as LocalPort) on both.
Enabled=1
PeerIP=127.0.0.1
LocalPort=47801
PeerPort=47802
; Snapshot interpolation for the remote puppet. 1 = smooth (buffer + lerp), 0 = snap to latest packet.
Interpolation=1
; Render the puppet this many ms behind local time. Higher = smoother but more visual lag.
; ~100ms suits same-PC/LAN; raise (150-200) for a jittery internet link.
InterpDelayMs=100
